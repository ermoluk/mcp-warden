[package]
name = "mcp-warden-core"
version = "0.5.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/ermoluk/mcp-warden"
readme = "README.md"
description = "Core traits and types for mcp-warden — local-first credential broker for AI agents. Implement these traits to plug in alternate keychain, approval, audit, or preset backends."
keywords = ["mcp", "credentials", "ai-agent", "security", "keychain"]
categories = ["authentication", "api-bindings"]

[dependencies]
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
directories = "5"
dirs = "5"
keyring = "4"
keyring-core = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["sync", "time", "rt"] }
toml = "0.8"
tracing = "0.1"
url = "2"
zeroize = { version = "1", features = ["zeroize_derive"] }
regex = "1"
# russh is included here only so `From<russh::Error>` can live on WardenError
# (required by russh's Handler trait). Consumers who don't use SSH still link
# it transitively; refactoring to a binary-local newtype is on the roadmap.
russh = "0.60"

[dev-dependencies]
tempfile = "3"
