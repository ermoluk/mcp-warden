name: nix
# `nix build` compiles the whole dependency tree, so it runs only when the
# flake or the dependencies change, and on demand.
on:
  push:
    branches: [main]
    paths: ['flake.nix', 'flake.lock', 'Cargo.toml', 'Cargo.lock', 'core/Cargo.toml']
  pull_request:
    paths: ['flake.nix', 'flake.lock', 'Cargo.toml', 'Cargo.lock', 'core/Cargo.toml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31
      - run: nix flake check --no-build
      - run: nix build -L
      - run: nix run . -- --version
