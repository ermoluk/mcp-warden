# cargo-deny: advisories, licenses, bans and sources for the dependency
# tree. CI runs `cargo deny check`; run it locally before a release.

[graph]
all-features = true

[advisories]
# Every advisory fails the check unless it is listed here with the reason
# it does not affect mcp-warden and what would remove it.
ignore = [
    # rsa 0.10.0-rc (Marvin attack): no rsa release fixes it, and russh
    # 0.65 still pulls it in for RSA user keys. mcp-warden only signs with
    # a user's RSA key for SSH authentication and never decrypts, which is
    # what the attack targets. It goes away only if RSA keys are dropped
    # (owner decision 2026-11-03: keep them) or rsa ships a fix.
    { id = "RUSTSEC-2023-0071", reason = "rsa via russh: no fix released; signing only" },
]
# Unmaintained and unsound crates deep in the tree are reported, not fatal:
# each is listed by `cargo deny check advisories` and reviewed per release.
unmaintained = "none"
unsound = "workspace"
yanked = "deny"

[licenses]
confidence-threshold = 0.9
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-1-Clause",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
