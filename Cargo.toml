[workspace]
members = [".", "core"]
resolver = "2"

[package]
name = "mcp-warden"
version = "0.6.0"
edition = "2024"
rust-version = "1.94.1"
license = "Apache-2.0"
description = "Local-first credential broker MCP server for AI coding agents."
readme = "README.md"
exclude = ["docs/demo.gif", "docs/demo/", "docs/brand/", "plugins/", ".claude-plugin/", "packaging/", "flake.nix", "flake.lock", "install.sh", "install.ps1", ".github/", ".cargo/", "deny.toml", "fuzz/"]
repository = "https://github.com/ermoluk/mcp-warden"
keywords = ["mcp", "credentials", "ai-agent", "security", "keychain"]
categories = ["command-line-utilities", "authentication"]

# `cargo binstall mcp-warden` fetches the prebuilt archive from the GitHub
# release instead of compiling.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/mcp-warden-{ target }.tar.gz"
pkg-fmt = "tgz"
bin-dir = "mcp-warden{ binary-ext }"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/mcp-warden-{ target }.zip"
pkg-fmt = "zip"

[dependencies]
mcp-warden-core = { version = "0.6.0", path = "core" }
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "io-util", "process", "signal", "time", "sync", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = "0.8"
rmcp = { version = "1.6", features = ["server", "macros", "schemars", "transport-io"] }
tokio-util = { version = "0.7", features = ["codec"] }
futures = "0.3"
bytes = "1"
schemars = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip"] }
# AWS Signature Version 4 for `aws_sigv4` presets: the signing protocol from
# AWS's own crate, not hand-written crypto.
aws-sigv4 = { version = "1.6", default-features = false, features = ["sign-http", "http1"] }
aws-credential-types = "1.3"
notify-rust = "4.18"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
percent-encoding = "2.3"
unicode-normalization = "0.1.25"
base64 = "0.22"
getrandom = "0.3"
memchr = "2"
regex = "1"
directories = "5"
dirs = "5"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
async-trait = "0.1"
is-terminal = "0.4"
ratatui = "0.30"
crossterm = "0.29"
russh = "0.65"
russh-sftp = "2.1"
tokio-postgres = { version = "0.7", features = ["with-serde_json-1", "with-chrono-0_4"] }
mysql_async = { version = "0.37", default-features = false, features = ["minimal-rust", "rustls-tls", "ring", "tls12"] }
redis = { version = "0.27", features = ["tokio-comp", "tokio-rustls-comp", "tls-rustls-webpki-roots"] }
openapiv3 = "2.2"
serde_yaml = "0.9"
axum = { version = "0.7", features = ["http1", "tokio"] }
zeroize = { version = "1", features = ["zeroize_derive"] }
rusqlite = { version = "0.32", features = ["bundled"] }
tokio-postgres-rustls = "0.14"
rustls-native-certs = "0.8"
webpki-roots = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
libc = "0.2"

[dev-dependencies]
insta = { version = "1", features = ["yaml", "json"] }
assert_cmd = "2"
predicates = "3"
tempfile = "3"
wiremock = "0.6"
proptest = { version = "1", default-features = false, features = ["std"] }
flate2 = "1"
# Only for generating RSA test keys (ssh-key takes a rand_core 0.10 RNG).
getrandom-sys-rng = { package = "getrandom", version = "0.4", features = ["sys_rng"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
opt-level = "z"
