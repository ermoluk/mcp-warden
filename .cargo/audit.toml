# cargo-audit: advisories accepted for now. Keep in step with the
# [advisories] ignore list in deny.toml, which gives the reason for each.
[advisories]
ignore = [
    "RUSTSEC-2023-0071", # rsa via russh: no fix released; signing only
    "RUSTSEC-2026-0387", # crypto-bigint pinned by russh's rsa pre-release
]
