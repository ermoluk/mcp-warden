# cargo-audit: advisories accepted for now. Keep in step with the
# [advisories] ignore list in deny.toml, which gives the reason for each.
[advisories]
ignore = [
    "RUSTSEC-2023-0071", # rsa via russh: no fix released; signing only
    "RUSTSEC-2026-0387", # crypto-bigint pinned by russh's rsa pre-release
    "RUSTSEC-2026-0194", # quick-xml parses only our own toast XML (Windows)
    "RUSTSEC-2026-0195", # quick-xml parses only our own toast XML (Windows)
    "RUSTSEC-2026-0391", # zstd in mysql_common: compression not enabled
    "RUSTSEC-2026-0398", # zstd-safe in mysql_common: compression not enabled
    "RUSTSEC-2026-0403", # zstd-safe in mysql_common: compression not enabled
    "RUSTSEC-2026-0410", # zstd-sys WebAssembly shim: not a target we build
]
